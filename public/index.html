<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Aviation Briefing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aviation Briefing">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4F1EA; --paper-2: #EBE6DB; --ink: #1B1A17; --ink-2: #2A2823; --body: #4A463F;
      --muted: #5E5A52; --faint: #8C877C; --rule: #DDD7CB; --rule-2: #CFC8BA;
      --pos: oklch(0.46 0.11 150); --neg: oklch(0.50 0.16 28);
      --serif: 'Newsreader', Georgia, serif; --sans: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --pad: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top); }
    body.article-open { overflow: hidden; }
    a { color: inherit; text-underline-offset: 2px; }
    a:hover { opacity: .7; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }

    header.mast { padding: 12px var(--pad) 0; display: flex; flex-direction: column; gap: 10px; }
    .mast-top { display: flex; justify-content: space-between; align-items: center; font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .mast-actions { display: flex; gap: 16px; }
    .mast-actions button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; padding: 6px 0; }
    .mast-actions button[disabled] { opacity: .4; }
    .title { font: 500 36px/1 var(--serif); letter-spacing: -.02em; padding-bottom: 12px; border-bottom: 3px double var(--ink); }
    .mast-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
    .today { padding: 6px 0 9px; font: 500 14px/1 var(--sans); color: var(--ink); border-bottom: 2px solid var(--ink); }
    .today span { color: var(--faint); font-weight: 400; }
    .counts { font: 400 12px/1 var(--sans); color: var(--muted); padding-bottom: 9px; white-space: nowrap; }
    .stale { margin: 10px var(--pad) 0; padding: 10px 12px; background: var(--paper-2); font: 400 12.5px/1.4 var(--sans); color: var(--ink-2); }
    .stale[hidden] { display: none; }

    .market { margin: 0 var(--pad); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
    .market[hidden] { display: none; }
    .ticker-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    .ticker { flex: 1; min-width: 0; display: flex; gap: 14px; overflow-x: auto; white-space: nowrap; font: 500 12px/1 var(--mono); scrollbar-width: none; }
    .ticker::-webkit-scrollbar { display: none; }
    .up { color: var(--pos); } .down { color: var(--neg); }
    .mkt-toggle { flex: none; font: 600 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 6px 0; }
    .mkt-table[hidden] { display: none; }
    .mkt-table { padding-bottom: 10px; }
    .mkt-line { display: grid; grid-template-columns: minmax(0,1fr) 56px auto 54px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
    .mkt-name { font: 400 13.5px/1.25 var(--sans); color: #3A3732; }
    .mkt-name small { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
    .mkt-val { font: 500 13.5px/1 var(--mono); white-space: nowrap; }
    .mkt-val small { font-size: 10px; color: var(--faint); }
    .mkt-chg { font: 500 12px/1 var(--mono); text-align: right; }
    .spark { width: 56px; height: 20px; display: block; }
    .mkt-note { font: 400 11px/1.4 var(--sans); color: var(--faint); padding-top: 6px; }

    .lead-story { margin: 0 var(--pad); padding: 20px 0 22px; border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 11px; cursor: pointer; }
    .kicker { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .kicker .prio { color: var(--neg); }
    .kicker .new { color: var(--ink); background: var(--paper-2); padding: 3px 5px; margin-top: -3px; }
    .kicker .updated { color: var(--ink); border: 1px solid var(--rule-2); padding: 2px 4px; margin-top: -3px; }
    .kicker .breaking { color: var(--paper); background: var(--neg); padding: 3px 5px; margin-top: -3px; }
    #new-pill { position: fixed; top: calc(env(safe-area-inset-top) + 62px); left: 50%; transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font: 600 12px/1 var(--sans); letter-spacing: .04em; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    #new-pill[hidden] { display: none; }
    .lead-story h2 { font: 500 31px/1.1 var(--serif); letter-spacing: -.02em; text-wrap: pretty; }
    .lead-story .why { font: italic 400 17px/1.45 var(--serif); color: #3A3732; text-wrap: pretty; }
    .meta { display: flex; justify-content: space-between; gap: 10px; font: 400 12px/1.3 var(--sans); color: var(--muted); }
    .meta strong { font-weight: 600; color: var(--ink); white-space: nowrap; }

    .filters { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
    .filters-inner { display: flex; gap: 6px; overflow-x: auto; padding: 10px var(--pad); scrollbar-width: none; }
    .filters-inner::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 8px 11px; border-radius: 999px; font: 500 12.5px/1 var(--sans); white-space: nowrap; color: var(--muted); }
    .chip span { opacity: .6; margin-left: 3px; }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

    .group { padding: 0 var(--pad); }
    .group-head { display: flex; align-items: center; gap: 10px; padding: 22px 0 2px; }
    .group-head::after { content: ""; flex: 1; height: 1px; background: var(--ink); }
    .row { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 6px; padding: 15px 0 16px; border-bottom: 1px solid var(--rule); cursor: pointer; text-align: left; width: 100%; }
    .row-num { font: 400 15px/1.4 var(--serif); color: var(--faint); }
    .row-body { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .row h3 { font: 500 20px/1.2 var(--serif); letter-spacing: -.01em; text-wrap: pretty; }
    .row p { font: 400 14px/1.5 var(--sans); color: var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row .src { font: 400 12px/1 var(--sans); color: var(--muted); }
    .end { padding: 28px var(--pad) calc(48px + env(safe-area-inset-bottom)); text-align: center; font: italic 400 14px/1 var(--serif); color: var(--faint); }
    .state { padding: 40px var(--pad); font: italic 400 17px/1.45 var(--serif); color: var(--muted); }
    .state strong { display: block; font-style: normal; font-weight: 500; color: var(--ink); margin-bottom: 4px; }

    .article { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.7,.2,1); visibility: hidden; }
    .article.open { transform: none; visibility: visible; }
    .art-bar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px var(--pad) 12px; border-bottom: 1px solid var(--rule); font: 500 14px/1 var(--sans); }
    .art-bar .pos { font-size: 12px; color: var(--faint); }
    .art-nav { justify-self: end; display: flex; gap: 6px; }
    .art-nav button { width: 34px; height: 34px; font-size: 18px; }
    .art-nav button[disabled] { color: var(--rule-2); }
    .art-back { justify-self: start; padding: 8px 0; }
    .art-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .art-body { padding: 22px var(--pad) calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
    .art-body h1 { font: 500 30px/1.12 var(--serif); letter-spacing: -.02em; text-wrap: pretty; }
    .art-src { font: 400 12px/1.3 var(--sans); color: var(--muted); }
    .art-why { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
    .art-why p { font: italic 400 17px/1.45 var(--serif); color: var(--ink-2); }
    .art-lead { font: 400 18px/1.5 var(--serif); color: var(--ink-2); text-wrap: pretty; }
    .bullets { display: flex; flex-direction: column; gap: 8px; list-style: none; }
    .bullets li { display: grid; grid-template-columns: 14px 1fr; font: 400 14.5px/1.5 var(--sans); color: var(--ink-2); }
    .bullets li::before { content: "—"; }
    .datapoints { display: flex; flex-wrap: wrap; gap: 6px; }
    .datapoints span { font: 500 12px/1 var(--mono); padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: 3px; }
    .impact { background: var(--paper-2); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .impact > p { font: 400 14px/1.5 var(--sans); color: var(--ink-2); }
    .exp { display: flex; flex-direction: column; gap: 3px; padding-top: 9px; border-top: 1px solid #D6CFC1; }
    .exp-head { display: flex; justify-content: space-between; gap: 10px; font: 600 13px/1.3 var(--sans); }
    .exp-head span:last-child { font-weight: 500; text-align: right; color: var(--muted); }
    .exp-head .up, .exp-head .down { color: inherit; }
    .exp-head span.up { color: var(--pos); } .exp-head span.down { color: var(--neg); }
    .exp p { font: 400 12.5px/1.45 var(--sans); color: var(--muted); }
    .art-link { font: italic 400 14px/1.45 var(--serif); color: #3A3732; }
    .next { margin-top: 8px; border-top: 3px double var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
    .next span:last-child { font: 500 20px/1.2 var(--serif); text-wrap: pretty; }

    .ios-prompt { margin: 12px var(--pad) 0; padding: 12px 14px; background: var(--ink); color: var(--paper); display: flex; gap: 12px; align-items: flex-start; font: 400 13px/1.4 var(--sans); }
    .ios-prompt[hidden] { display: none; }
    .ios-prompt button { color: var(--faint); font-size: 16px; }
    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 120px); background: var(--ink); color: var(--paper); padding: 10px 16px; font: 500 13px/1.3 var(--sans); z-index: 100; transition: transform .3s ease; pointer-events: none; }
    #toast.show { transform: translate(-50%, 0); }
    @media (min-width: 700px) { .title { font-size: 48px; } .lead-story h2 { font-size: 38px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div class="mast-top">
        <span id="dateline">—</span>
        <div class="mast-actions">
          <button id="btn-share" type="button">Share</button>
        </div>
      </div>
      <div class="title">The Aviation Briefing</div>
      <div class="mast-row">
        <div class="today">Today <span>· updates automatically</span></div>
        <span class="counts" id="counts"></span>
      </div>
    </header>

    <div class="ios-prompt" id="ios-prompt" hidden>
      <span>Install on iPhone: tap <strong>Share</strong> in Safari, then <strong>Add to Home Screen</strong>.</span>
      <button type="button" id="ios-close" aria-label="Dismiss">✕</button>
    </div>
    <div class="stale" id="stale" hidden></div>

    <section class="market" id="market" hidden aria-label="Markets and fuel">
      <div class="ticker-row">
        <div class="ticker" id="ticker"></div>
        <button class="mkt-toggle" id="mkt-toggle" type="button" aria-expanded="false">All indicators</button>
      </div>
      <div class="mkt-table" id="mkt-table" hidden></div>
    </section>

    <main id="content"><div class="state">Loading the briefing…</div></main>
  </div>

  <div class="article" id="article" aria-hidden="true">
    <div class="art-bar">
      <button class="art-back" id="art-back" type="button">‹ Briefing</button>
      <span class="pos" id="art-pos"></span>
      <div class="art-nav">
        <button id="art-prev" type="button" aria-label="Previous story">↑</button>
        <button id="art-next" type="button" aria-label="Next story">↓</button>
      </div>
    </div>
    <div class="art-scroll" id="art-scroll"><div class="art-body" id="art-body"></div></div>
  </div>

  <button id="new-pill" type="button" hidden></button>
  <div id="toast"></div>

  <script>
    const SECTION_ORDER = [
      "Europe", "Middle East & Gulf", "Asia-Pacific", "Americas", "Africa", "Manufacturers & Supply Chain", "Regulation & Airspace",
      "Turkey / THY and Turkish aviation", "European and other global airlines", "Route news", "Other areas", "Other"
    ];
    const MODE = { daily: { empty: "No verified developments yet today.", loading: "Loading today's briefing…" } };
    const POLL_INTERVAL_MS = 5 * 60 * 1000;
    const MIN_POLL_GAP_MS = 60 * 1000;
    const SCROLL_TOP_THRESHOLD = 120;
    const SOURCE_TYPES = { mainstream: "Mainstream", trade_media: "Aviation media", airline_ir: "Airline IR", airline_newsroom: "Official newsroom", official_social: "Official social" };
    const MARKET_ORDER = ["brent_spot", "us_gulf_coast_jet_fuel", "jet_fuel_brent_crack_spread", "fx_usd_eur", "fx_usd_gbp", "fx_usd_jpy", "fx_usd_cny", "fx_usd_inr", "fx_usd_try", "fx_usd_brl"];
    const MARKET_LABELS = {
      brent_spot: ["Brent", "Brent spot"],
      us_gulf_coast_jet_fuel: ["Jet USGC", "US Gulf Coast jet fuel"],
      jet_fuel_brent_crack_spread: ["Crack", "Jet fuel – Brent spread"]
    };

    const state = { mode: "daily", filter: "All", data: null, stories: [], order: [], articleId: null, newKeys: new Set(), pending: null, polling: false, lastPoll: 0 };
    const previousKeysByMode = new Map();
    let briefingRequestId = 0;

    const HTML_ESCAPE_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const $ = (id) => document.getElementById(id);
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => HTML_ESCAPE_MAP[c]); }
    function safeExternalUrl(value) {
      try {
        const parsed = new URL(String(value || ""), window.location.origin);
        if (!["http:", "https:"].includes(parsed.protocol)) return "#";
        return escapeHtml(parsed.href);
      } catch { return "#"; }
    }
    function storyKey(story) {
      const url = story && story.original_source && story.original_source.url;
      return String(story && (story.id || url || story.headline) || "story").trim().toLowerCase();
    }
    function dedupe(stories) {
      const seen = new Set();
      return stories.filter(s => { const k = storyKey(s); if (seen.has(k)) return false; seen.add(k); return true; });
    }
    function isPriority(story) {
      const text = [story.headline, story.lead, story.why_it_matters, story.strategic_impact].join(" ");
      return /(critical|urgent|emergency|security|safety|accident|divert|closure|strike|warning|alarm|hijack|disrupt)/i.test(text);
    }
    function sectionOf(story) { return story.section || "Other"; }
    function badgeSet(story) { return new Set(Array.isArray(story.badges) ? story.badges : []); }
    function isNewStory(story) { return state.newKeys.has(storyKey(story)) || badgeSet(story).has("new"); }
    function tagsHtml(story, includePriority = true) {
      const badges = badgeSet(story);
      return [
        includePriority && isPriority(story) ? `<span class="prio">Priority</span>` : "",
        badges.has("breaking") ? `<span class="breaking">Breaking</span>` : "",
        isNewStory(story) ? `<span class="new">New</span>` : "",
        badges.has("updated") ? `<span class="updated">Updated</span>` : ""
      ].join("");
    }
    function sectionRank(name) { const i = SECTION_ORDER.indexOf(name); return i === -1 ? SECTION_ORDER.length : i; }
    function tone(impact) {
      const r = String(impact || "").toLowerCase();
      if (/neg|adverse|risk|cost|headwind|pressure|disrupt/.test(r)) return "down";
      if (/pos|growth|opp|hedged/.test(r)) return "up";
      return "";
    }
    function fmtNumber(v, digits) { const n = Number(v); return Number.isFinite(n) ? new Intl.NumberFormat("en-GB", { maximumFractionDigits: digits }).format(n) : "–"; }
    function fmtChange(v) { const n = Number(v); if (!Number.isFinite(n)) return ""; return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1) + "%"; }
    function showToast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); }

    async function loadBriefing(mode, requestLatest = false) {
      const requestId = ++briefingRequestId;
      const keepsCurrent = requestLatest && state.data && state.data.mode === mode;
      if (!keepsCurrent) $("content").innerHTML = `<div class="state">${MODE[mode].loading}</div>`;
      try {
        const cacheBuster = requestLatest ? `&view=${Date.now()}` : "";
        const res = await fetch(`/api/briefing?mode=${encodeURIComponent(mode)}${cacheBuster}`, {
          cache: requestLatest ? "no-store" : "default",
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        if (!(res.headers.get("content-type") || "").includes("application/json")) throw new Error("Invalid API response");
        const data = await res.json();
        if (requestId !== briefingRequestId) return;
        render(data, mode);
      } catch (err) {
        if (requestId !== briefingRequestId) return;
        console.error("Briefing load failed:", err);
        if (keepsCurrent) { showToast("Couldn't refresh — showing the last briefing."); return; }
        $("content").innerHTML = `<div class="state"><strong>The briefing couldn't be loaded.</strong>Please try again shortly.</div>`;
      }
    }

    function render(data, mode) {
      state.data = Object.assign({ mode }, data);
      state.pending = null;
      $("new-pill").hidden = true;
      const stories = dedupe(Array.isArray(data.stories) ? data.stories : []);
      const prev = previousKeysByMode.get(mode);
      state.newKeys = prev ? new Set(stories.map(storyKey).filter(k => !prev.has(k))) : new Set();
      previousKeysByMode.set(mode, new Set(stories.map(storyKey)));
      state.stories = stories;
      const sections = new Set(stories.map(sectionOf));
      if (state.filter !== "All" && !sections.has(state.filter)) state.filter = "All";

      $("dateline").textContent = [data.date_str, data.time_str].filter(Boolean).join(" · ") || "—";
      const prioCount = stories.filter(isPriority).length;
      $("counts").textContent = `${stories.length} ${stories.length === 1 ? "story" : "stories"} · ${prioCount} priority`;
      const stale = $("stale");
      if (data.status === "stale") {
        stale.hidden = false;
        stale.textContent = "The latest update didn't complete. Showing the last successful briefing" + (data.last_pipeline_run_at ? ` from ${new Date(data.last_pipeline_run_at).toUTCString().slice(5, 22)} UTC.` : ".");
      } else stale.hidden = true;

      renderMarket(data.market);
      renderList();
      if (state.articleId) renderArticle();
    }

    function renderList() {
      const { stories, filter, mode } = state;
      if (!stories.length) { state.order = []; $("content").innerHTML = `<div class="state">${MODE[mode].empty}</div><div class="end">— End of briefing —</div>`; return; }
      const counts = {};
      stories.forEach(s => { const k = sectionOf(s); counts[k] = (counts[k] || 0) + 1; });
      const sectionNames = Object.keys(counts).sort((a, b) => sectionRank(a) - sectionRank(b));

      const lead = filter === "All" ? (stories.find(isPriority) || stories[0]) : null;
      const rest = stories.filter(s => s !== lead && (filter === "All" || sectionOf(s) === filter));
      const groups = (filter === "All" ? sectionNames : [filter]).map(name => ({ name, items: rest.filter(s => sectionOf(s) === name) })).filter(g => g.items.length);
      state.order = (lead ? [lead] : []).concat(...groups.map(g => g.items));

      let html = "";
      if (lead) {
        html += `<article class="lead-story" data-open="${escapeHtml(storyKey(lead))}">
          <div class="kicker">${kickerBits(lead, isPriority(lead) ? "Priority" : "Lead story")}</div>
          <h2>${escapeHtml(lead.headline)}</h2>
          ${lead.why_it_matters ? `<p class="why">${escapeHtml(lead.why_it_matters)}</p>` : ""}
          <div class="meta"><span>${escapeHtml(sourceName(lead))}</span><strong>Read the analysis →</strong></div>
        </article>`;
      }
      html += `<nav class="filters" aria-label="Filter by region"><div class="filters-inner">
        ${[["All", stories.length]].concat(sectionNames.map(n => [n, counts[n]])).map(([name, c]) =>
          `<button class="chip" type="button" data-filter="${escapeHtml(name)}" aria-pressed="${name === filter}">${escapeHtml(name)}<span>${c}</span></button>`).join("")}
      </div></nav>`;
      let n = lead ? 1 : 0;
      groups.forEach(g => {
        html += `<section class="group"><div class="group-head eyebrow">${escapeHtml(g.name)}</div>`;
        g.items.forEach(s => {
          n++;
          const flags = tagsHtml(s);
          html += `<button class="row" type="button" data-open="${escapeHtml(storyKey(s))}">
            <span class="row-num">${String(n).padStart(2, "0")}</span>
            <span class="row-body">
              ${flags ? `<span class="kicker">${flags}</span>` : ""}
              <h3>${escapeHtml(s.headline)}</h3>
              ${s.why_it_matters ? `<p>${escapeHtml(s.why_it_matters)}</p>` : ""}
              <span class="src">${escapeHtml(sourceName(s))}${s.published_at ? " · " + escapeHtml(s.published_at) : ""}</span>
            </span>
          </button>`;
        });
        html += `</section>`;
      });
      html += `<div class="end">— End of briefing —</div>`;
      $("content").innerHTML = html;
    }

    function kickerBits(s, first) {
      return [`<span class="${first === "Priority" ? "prio" : ""}">${first}</span>`, `<span>${escapeHtml(sectionOf(s))}</span>`, tagsHtml(s, false)].join("");
    }
    function sourceName(s) { const o = s.original_source || {}; return o.source_name || o.title || "Verified source"; }

    function renderMarket(market) {
      const items = (market && Array.isArray(market.items) ? market.items : []).slice()
        .sort((a, b) => (MARKET_ORDER.indexOf(a.series_id) + 99) % 99 - (MARKET_ORDER.indexOf(b.series_id) + 99) % 99);
      if (!items.length) { $("market").hidden = true; return; }
      const label = (it) => {
        if (MARKET_LABELS[it.series_id]) return MARKET_LABELS[it.series_id];
        const m = /^fx_usd_([a-z]{3})$/.exec(it.series_id || "");
        return m ? [`USD/${m[1].toUpperCase()}`, `USD / ${m[1].toUpperCase()}`] : [it.name || it.series_id, it.name || it.series_id];
      };
      const chg = (it) => Number(it.changes && it.changes.daily_pct);
      const cls = (v) => Number.isFinite(v) ? (v >= 0 ? "up" : "down") : "";
      $("ticker").innerHTML = items.map(it => `<span>${escapeHtml(label(it)[0])} ${fmtNumber(it.value, 3)} <span class="${cls(chg(it))}">${fmtChange(chg(it))}</span></span>`).join("");
      $("mkt-table").innerHTML = items.map(it => {
        const asOf = it.as_of ? `${it.as_of}${it.carried_forward ? " · last valid value" : ""}` : "";
        return `<div class="mkt-line">
          <span class="mkt-name">${escapeHtml(label(it)[1])}<small>${escapeHtml(asOf)}</small></span>
          ${sparkline(it.sparkline)}
          <span class="mkt-val">${fmtNumber(it.value, 3)} <small>${escapeHtml(it.unit || "")}</small></span>
          <span class="mkt-chg ${cls(chg(it))}">${fmtChange(chg(it))}</span>
        </div>`;
      }).join("") + `<p class="mkt-note">EIA · ECB reference rates. Jet fuel is the US Gulf Coast series, not a global price.${market.iata_monitor && market.iata_monitor.url ? ` <a href="${safeExternalUrl(market.iata_monitor.url)}" target="_blank" rel="noopener noreferrer">IATA Jet Fuel Price Monitor ↗</a>` : ""}</p>`;
      $("market").hidden = false;
    }
    function sparkline(points) {
      const v = (Array.isArray(points) ? points : []).map(p => Number(p && p.value)).filter(Number.isFinite);
      if (v.length < 2) return `<span></span>`;
      const mn = Math.min(...v), sp = Math.max(...v) - mn || 1;
      const pts = v.map((x, i) => `${(i / (v.length - 1) * 100).toFixed(1)},${(26 - (x - mn) / sp * 24).toFixed(1)}`).join(" ");
      return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#1B1A17" stroke-width="1.3" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
    }

    function openArticle(key, push = true) {
      state.articleId = key;
      renderArticle();
      $("article").classList.add("open");
      $("article").setAttribute("aria-hidden", "false");
      document.body.classList.add("article-open");
      if (push) history.pushState({ article: key }, "", "#" + encodeURIComponent(key));
    }
    function closeArticle(fromPop = false) {
      state.articleId = null;
      $("article").classList.remove("open");
      $("article").setAttribute("aria-hidden", "true");
      document.body.classList.remove("article-open");
      if (!fromPop && history.state && history.state.article) history.back();
      setTimeout(checkForNewVersion, 0);
    }
    function renderArticle() {
      const i = state.order.findIndex(s => storyKey(s) === state.articleId);
      if (i < 0) { closeArticle(); return; }
      const s = state.order[i], next = state.order[i + 1];
      const src = s.original_source || {};
      const type = SOURCE_TYPES[src.source_type] || "Verified source";
      const analysis = (s.detailed_analysis || []).map(b => `<li>${escapeHtml(b)}</li>`).join("");
      const dps = (s.data_points || []).map(d => `<span>${escapeHtml(d)}</span>`).join("");
      const exposure = (Array.isArray(s.market_exposure) ? s.market_exposure : []).map(e =>
        `<div class="exp"><div class="exp-head"><span>${escapeHtml(e.carrier || "Stakeholder")}</span><span class="${tone(e.impact)}">${escapeHtml(e.impact || "Neutral")}</span></div>${e.details ? `<p>${escapeHtml(e.details)}</p>` : ""}</div>`).join("");
      const strategic = s.strategic_impact || "";
      $("art-pos").textContent = `${i + 1} of ${state.order.length}`;
      $("art-prev").disabled = i === 0;
      $("art-next").disabled = !next;
      $("art-body").innerHTML = `
        <div class="kicker">${isPriority(s) ? `<span class="prio">Priority</span>` : ""}<span>${escapeHtml(sectionOf(s))}</span>${tagsHtml(s, false)}</div>
        <h1>${escapeHtml(s.headline)}</h1>
        <div class="art-src">${escapeHtml(sourceName(s))} · ${type}${src.official ? " · Official" : ""}${s.published_at ? " · " + escapeHtml(s.published_at) : ""}</div>
        ${s.why_it_matters ? `<div class="art-why"><span class="eyebrow">Why it matters</span><p>${escapeHtml(s.why_it_matters)}</p></div>` : ""}
        ${s.lead ? `<p class="art-lead">${escapeHtml(s.lead)}</p>` : ""}
        ${analysis ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Analysis</span><ul class="bullets">${analysis}</ul></div>` : ""}
        ${dps ? `<div class="datapoints">${dps}</div>` : ""}
        ${strategic || exposure ? `<div class="impact"><span class="eyebrow">Strategic &amp; market impact</span>${strategic ? `<p>${escapeHtml(strategic)}</p>` : ""}${exposure}</div>` : ""}
        <a class="art-link" href="${safeExternalUrl(src.url)}" target="_blank" rel="noopener noreferrer">Original source: ${escapeHtml(src.title || "Read full article")}${src.source_name ? " — " + escapeHtml(src.source_name) : ""} ↗</a>
        ${next ? `<button class="next" type="button" data-open="${escapeHtml(storyKey(next))}" data-replace="1"><span class="eyebrow" style="color:var(--muted)">Next story ↓</span><span>${escapeHtml(next.headline)}</span></button>` : ""}`;
      $("art-scroll").scrollTop = 0;
    }
    function stepArticle(delta) {
      const i = state.order.findIndex(s => storyKey(s) === state.articleId);
      const target = state.order[i + delta];
      if (!target) return;
      state.articleId = storyKey(target);
      history.replaceState({ article: state.articleId }, "", "#" + encodeURIComponent(state.articleId));
      renderArticle();
    }

    function shareBriefing() {
      if (!state.data) return;
      let text = `${state.data.heading || "The Aviation Briefing"}\n${state.data.intro_sentence || ""}\n`;
      const order = state.order.length ? state.order : state.stories;
      order.forEach(s => {
        text += `\n• ${s.headline}\n`;
        if (s.why_it_matters) text += `  ${s.why_it_matters}\n`;
        if (s.original_source && s.original_source.url) text += `  ${s.original_source.url}\n`;
      });
      const copy = () => navigator.clipboard.writeText(text).then(() => showToast("Briefing copied to clipboard.")).catch(() => showToast("Couldn't copy."));
      if (navigator.share) navigator.share({ title: state.data.heading || "The Aviation Briefing", text }).catch(copy);
      else copy();
    }

    // A home-screen app is frozen when it goes to the background and resumes with the OLD page code, so a
    // new deployment never reaches it. The page therefore compares its own source with the server's when it
    // returns to the foreground and every few minutes, and reloads itself when they differ.
    let pageFingerprint = null;
    function fingerprint(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
      return (hash >>> 0).toString(16) + ":" + text.length;
    }
    async function checkForNewVersion() {
      try {
        const res = await fetch(location.pathname, { cache: "no-store" });
        if (!res.ok) return;
        const current = fingerprint(await res.text());
        if (pageFingerprint === null) { pageFingerprint = current; return; }
        // Never replace the page under a reader who has a story open; the next check applies it.
        if (current !== pageFingerprint && !state.articleId) location.reload();
      } catch (err) {
        console.error("Version check failed:", err);
      }
    }
    async function backgroundRefresh() {
      await checkForNewVersion();
      await pollBriefing();
    }

    // New stories are added without a reload: poll quietly, insert at once when the reader is at the top,
    // otherwise offer a "new stories" button so the reading position never jumps.
    async function pollBriefing() {
      if (document.hidden || state.polling || !state.data) return;
      state.polling = true;
      state.lastPoll = Date.now();
      try {
        const res = await fetch(`/api/briefing?mode=${state.mode}`, { cache: "default", headers: { "Accept": "application/json" } });
        if (!res.ok || !(res.headers.get("content-type") || "").includes("application/json")) return;
        applyPolled(await res.json());
      } catch (err) {
        console.error("Background refresh failed:", err);
      } finally {
        state.polling = false;
      }
    }
    function applyPolled(data) {
      const known = new Set(state.stories.map(storyKey));
      const arrived = dedupe(Array.isArray(data.stories) ? data.stories : []).filter(s => !known.has(storyKey(s)));
      const atTop = window.scrollY < SCROLL_TOP_THRESHOLD && !state.articleId;
      const label = `${arrived.length} new ${arrived.length === 1 ? "story" : "stories"}`;
      if (!arrived.length) { if (atTop) render(data, state.mode); return; }
      if (atTop) { render(data, state.mode); showToast(`${label} added`); return; }
      state.pending = data;
      $("new-pill").textContent = `↑ ${label}`;
      $("new-pill").hidden = false;
    }

    document.addEventListener("DOMContentLoaded", () => {
      $("new-pill").addEventListener("click", () => {
        if (state.articleId) closeArticle();
        if (state.pending) render(state.pending, state.mode);
        window.scrollTo(0, 0);
      });
      setInterval(backgroundRefresh, POLL_INTERVAL_MS);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) return;
        checkForNewVersion();
        if (Date.now() - state.lastPoll > MIN_POLL_GAP_MS) pollBriefing();
      });
      checkForNewVersion();
      $("btn-share").addEventListener("click", shareBriefing);
      $("mkt-toggle").addEventListener("click", () => {
        const table = $("mkt-table"), open = table.hidden;
        table.hidden = !open;
        $("mkt-toggle").textContent = open ? "Hide" : "All indicators";
        $("mkt-toggle").setAttribute("aria-expanded", String(open));
      });
      $("content").addEventListener("click", (e) => {
        const chip = e.target.closest("[data-filter]");
        if (chip) {
          state.filter = chip.dataset.filter;
          const top = document.querySelector(".filters").getBoundingClientRect().top + window.scrollY;
          renderList();
          if (window.scrollY > top) window.scrollTo(0, top);
          return;
        }
        const item = e.target.closest("[data-open]");
        if (item) openArticle(item.dataset.open);
      });
      $("art-body").addEventListener("click", (e) => { const n = e.target.closest("[data-open]"); if (n) stepArticle(1); });
      $("art-back").addEventListener("click", () => closeArticle());
      $("art-prev").addEventListener("click", () => stepArticle(-1));
      $("art-next").addEventListener("click", () => stepArticle(1));
      window.addEventListener("popstate", (e) => {
        if (e.state && e.state.article && state.stories.length) openArticle(e.state.article, false);
        else if (state.articleId) closeArticle(true);
      });
      document.addEventListener("keydown", (e) => {
        if (!state.articleId) return;
        if (e.key === "Escape") closeArticle();
        if (e.key === "ArrowDown" || e.key === "j") stepArticle(1);
        if (e.key === "ArrowUp" || e.key === "k") stepArticle(-1);
      });

      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      if (isIos && !standalone && !localStorage.getItem("ios_prompt_dismissed")) $("ios-prompt").hidden = false;
      $("ios-close").addEventListener("click", () => { $("ios-prompt").hidden = true; localStorage.setItem("ios_prompt_dismissed", "true"); });

      if (location.hash) history.replaceState(null, "", location.pathname + location.search);
      loadBriefing(state.mode);
    });
  </script>
</body>
</html>
