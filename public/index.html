<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Aviation Briefing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aviation Briefing">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4F1EA; --paper-2: #EBE6DB; --ink: #1B1A17; --ink-2: #2A2823; --body: #4A463F;
      --muted: #5E5A52; --faint: #6A655B; --rule: #DDD7CB; --rule-2: #CFC8BA;
      --pos: oklch(0.46 0.11 150); --neg: oklch(0.50 0.16 28);
      --serif: 'Newsreader', Georgia, serif; --sans: 'IBM Plex Sans', -apple-system, 'Helvetica Neue', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --pad: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top); }
    body.article-open { overflow: hidden; }
    a { color: inherit; text-underline-offset: 2px; }
    a:hover { opacity: .7; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }

    header.mast { padding: 12px var(--pad) 0; display: flex; flex-direction: column; gap: 10px; }
    .mast-top { display: flex; justify-content: space-between; align-items: center; font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .mast-actions { display: flex; gap: 16px; }
    .mast-actions button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; padding: 6px 0; }
        .title { font: 500 36px/1 var(--serif); letter-spacing: -.02em; padding-bottom: 12px; border-bottom: 3px double var(--ink); }
    .mast-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
        .mast-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding-bottom: 9px; white-space: nowrap; font: 400 12px/1 var(--sans); color: var(--muted); }
    .mast-meta #updated { font-size: 11px; color: var(--faint); }
    .page-nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 10px; border-bottom: 1px solid var(--ink); }
    .archive-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px var(--pad); font: 500 13px/1.4 var(--sans); }
    .archive-controls[hidden] { display: none; }
    .archive-controls input, .archive-controls button { padding: 9px; min-height: 44px; border: 1px solid var(--rule-2); border-radius: 4px; background: var(--paper); color: var(--ink); font: inherit; max-width: 100%; }
    .archive-controls button:disabled { opacity: .45; cursor: default; }
    .archive-note { width: 100%; margin: 0; color: var(--muted); font-weight: 400; }
    .page-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--rule-2); border-radius: 999px; font: 600 11.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--paper); transition: background .15s ease, color .15s ease; }
    .page-btn .page-cnt { font: 500 11px/1 var(--mono); color: var(--faint); }
    .page-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .page-btn[aria-pressed="true"] .page-cnt { color: var(--rule-2); }
    .report-intro { margin: 0 var(--pad); padding: 14px 0 12px; border-bottom: 1px solid var(--rule); font: 400 13.5px/1.45 var(--sans); color: var(--body); }
    .report-intro strong { color: var(--ink); font-weight: 600; }
    .row-dps { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .row-dps span { font: 500 11px/1 var(--mono); padding: 4px 7px; background: var(--paper-2); border: 1px solid var(--rule-2); border-radius: 3px; color: var(--ink-2); }
    .stale { margin: 10px var(--pad) 0; padding: 10px 12px; background: var(--paper-2); font: 400 12.5px/1.4 var(--sans); color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
    .stale[hidden] { display: none; }

    .market { margin: 0 var(--pad); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
    .market[hidden] { display: none; }
    .ticker-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    .ticker { flex: 1; min-width: 0; display: flex; gap: 14px; overflow-x: auto; white-space: nowrap; font: 500 12px/1 var(--mono); scrollbar-width: none; }
    .ticker::-webkit-scrollbar { display: none; }
    .up { color: var(--pos); } .down { color: var(--neg); }
    .mkt-toggle { flex: none; font: 600 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 6px 0; }
    .mkt-table[hidden] { display: none; }
    .mkt-table { padding-bottom: 10px; }
    .mkt-line { display: grid; grid-template-columns: minmax(0,1fr) 56px auto 54px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
    .mkt-name { font: 400 13.5px/1.25 var(--sans); color: #3A3732; }
    .mkt-name small { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
    .mkt-val { font: 500 13.5px/1 var(--mono); white-space: nowrap; }
    .mkt-val small { font-size: 10px; color: var(--faint); }
    .mkt-chg { font: 500 12px/1 var(--mono); text-align: right; }
    .spark { width: 56px; height: 20px; display: block; }
    .mkt-note { font: 400 11px/1.4 var(--sans); color: var(--muted); padding-top: 6px; }
    .mkt-miss { color: var(--muted); font-weight: 400; }

    .lead-story { margin: 0 var(--pad); padding: 20px 0 22px; border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 11px; cursor: pointer; }
    .kicker { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .kicker .lvl-critical { color: var(--neg); }
    .kicker .lvl-important { color: var(--ink); }
    .kicker .new { color: var(--ink); background: var(--paper-2); padding: 3px 5px; margin-top: -3px; }
    .kicker .updated { color: var(--ink); border: 1px solid var(--rule-2); padding: 2px 4px; margin-top: -3px; }
    .kicker .breaking { color: var(--paper); background: var(--neg); padding: 3px 5px; margin-top: -3px; }
    #new-pill { position: fixed; top: calc(env(safe-area-inset-top) + 62px); left: 50%; transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font: 600 12px/1 var(--sans); letter-spacing: .04em; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    #new-pill[hidden] { display: none; }
    .lead-story h2 { font: 500 31px/1.1 var(--serif); letter-spacing: -.02em; text-wrap: pretty; }
    .lead-story .why { font: italic 400 17px/1.45 var(--serif); color: #3A3732; text-wrap: pretty; }
    .meta { display: flex; justify-content: space-between; gap: 10px; font: 400 12px/1.3 var(--sans); color: var(--muted); }
    .meta strong { font-weight: 600; color: var(--ink); white-space: nowrap; }

    .filters { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
    .filters-inner { display: flex; gap: 6px; overflow-x: auto; padding: 10px var(--pad); scrollbar-width: none; }
    .filters-inner::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding: 8px 11px; border-radius: 999px; font: 500 12.5px/1 var(--sans); white-space: nowrap; color: var(--muted); }
    .chip span { color: var(--faint); margin-left: 3px; }
    .chip[aria-pressed="true"] span { color: var(--rule-2); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

    .group { padding: 0 var(--pad); }
    .group-head { display: flex; align-items: center; gap: 10px; padding: 22px 0 2px; }
    .group-head::after { content: ""; flex: 1; height: 1px; background: var(--ink); }
    .row { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 6px; padding: 15px 0 16px; border-bottom: 1px solid var(--rule); cursor: pointer; text-align: left; width: 100%; }
    .row-num { font: 400 15px/1.4 var(--serif); color: var(--faint); }
    .row-body { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .row h3 { font: 500 20px/1.2 var(--serif); letter-spacing: -.01em; text-wrap: pretty; }
    .row p { font: 400 14px/1.5 var(--sans); color: var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row .src { font: 400 12px/1.3 var(--sans); color: var(--muted); }
    .row.compact { padding: 12px 0 13px; }
    .row.compact h3 { font-size: 18px; }
    .row.compact .row-num { color: var(--muted); }
    .row .pending, .art-pending { font: italic 400 14px/1.4 var(--serif); color: var(--muted); }
    .art-pending { padding: 10px 12px; background: var(--paper-2); }
    .sources { display: flex; flex-direction: column; gap: 8px; list-style: none; }
    .sources li { font: 400 13.5px/1.4 var(--sans); color: var(--ink-2); }
    .sources a { text-decoration: none; border-bottom: 1px solid var(--rule-2); }
    .sources .by { color: var(--muted); font-weight: 600; }
    .end { padding: 28px var(--pad) calc(48px + env(safe-area-inset-bottom)); text-align: center; font: italic 400 14px/1 var(--serif); color: var(--faint); }
    .state { padding: 40px var(--pad); font: italic 400 17px/1.45 var(--serif); color: var(--muted); }
    .state strong { display: block; font-style: normal; font-weight: 500; color: var(--ink); margin-bottom: 4px; }

    .article { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.7,.2,1); visibility: hidden; }
    .article.open { transform: none; visibility: visible; }
    .art-bar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px var(--pad) 12px; border-bottom: 1px solid var(--rule); font: 500 14px/1 var(--sans); }
    .art-bar .pos { font-size: 12px; color: var(--faint); }
    .art-nav { justify-self: end; display: flex; gap: 6px; }
    .art-nav button { width: 34px; height: 34px; font-size: 18px; }
    .art-nav button[disabled] { color: var(--rule-2); cursor: default; }
    .art-back { justify-self: start; padding: 8px 0; }
    .art-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .art-body { padding: 22px var(--pad) calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
    .art-body h1 { font: 500 30px/1.12 var(--serif); letter-spacing: -.02em; text-wrap: pretty; }
    .art-body h1:focus { outline: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .art-src { font: 400 12px/1.3 var(--sans); color: var(--muted); }
    .art-why { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
    .art-why p { font: italic 400 17px/1.45 var(--serif); color: var(--ink-2); }
    .art-lead { font: 400 18px/1.5 var(--serif); color: var(--ink-2); text-wrap: pretty; }
    .bullets { display: flex; flex-direction: column; gap: 8px; list-style: none; }
    .bullets li { display: grid; grid-template-columns: 14px 1fr; font: 400 14.5px/1.5 var(--sans); color: var(--ink-2); }
    .bullets li::before { content: "—"; }
    .datapoints { display: flex; flex-wrap: wrap; gap: 6px; }
    .datapoints span { font: 500 12px/1 var(--mono); padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: 3px; }
    .impact { background: var(--paper-2); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .impact > p { font: 400 14px/1.5 var(--sans); color: var(--ink-2); }
    .exp { display: flex; flex-direction: column; gap: 3px; padding-top: 9px; border-top: 1px solid #D6CFC1; }
    .exp-head { display: flex; justify-content: space-between; gap: 10px; font: 600 13px/1.3 var(--sans); }
    .exp-head span:last-child { font-weight: 500; text-align: right; color: var(--muted); }
    .exp-head .up, .exp-head .down { color: inherit; }
    .exp-head span.up { color: var(--pos); } .exp-head span.down { color: var(--neg); }
    .exp p { font: 400 12.5px/1.45 var(--sans); color: var(--muted); }
    .art-link { font: italic 400 14px/1.45 var(--serif); color: #3A3732; }
    .next { margin-top: 8px; border-top: 3px double var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
    .next span:last-child { font: 500 20px/1.2 var(--serif); text-wrap: pretty; }
    .report-badge-pill { font: 700 10.5px/1 var(--sans); background: var(--ink); color: #fff; padding: 3px 6px; border-radius: 2px; letter-spacing: 0.05em; text-transform: uppercase; display: inline-block; vertical-align: middle; }
    .report-kpi-section { display: flex; flex-direction: column; gap: 8px; margin: 4px 0; }
    .report-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    .report-kpi-card { background: var(--paper-2); border: 1px solid var(--rule-2); border-left: 3px solid var(--ink); padding: 10px 12px; border-radius: 3px; display: flex; flex-direction: column; gap: 2px; }
    .report-kpi-val { font: 700 17px/1.1 var(--mono); color: var(--ink); letter-spacing: -0.02em; }
    .report-kpi-label { font: 500 10px/1.2 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .report-takeaways { background: var(--paper-2); border: 1px solid var(--rule-2); padding: 14px 16px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px; }
    .report-bullets { display: flex; flex-direction: column; gap: 8px; list-style: none; }
    .report-bullets li { display: grid; grid-template-columns: 16px 1fr; font: 400 14px/1.5 var(--sans); color: var(--ink-2); }
    .report-bullets li::before { content: "▪"; color: var(--ink); font-size: 14px; line-height: 1.4; }
    .report-why { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
    .report-why p { font: italic 400 17px/1.45 var(--serif); color: var(--ink-2); }
    .report-cta-btn { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--ink); color: var(--paper) !important; border-radius: 4px; font: 600 13.5px/1 var(--sans); text-decoration: none; margin-top: 4px; }
    .report-cta-btn:hover { opacity: 0.92; }
    .report-dps-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
    .report-dp-chip { font: 600 11.5px/1 var(--mono); padding: 5px 8px; background: var(--paper-2); border: 1px solid var(--rule-2); border-radius: 3px; color: var(--ink); }
    .report-view-link { color: var(--ink); }
    .flash-alert-badge { font: 700 10px/1 var(--sans); background: #B91C1C; color: #fff; padding: 3px 6px; border-radius: 2px; letter-spacing: 0.05em; text-transform: uppercase; display: inline-block; vertical-align: middle; }
    .flash-alert-banner { background: #FEF2F2; border: 1px solid #FCA5A5; border-left: 4px solid #B91C1C; padding: 10px 14px; border-radius: 3px; font: 400 13px/1.4 var(--sans); color: #991B1B; margin: 4px 0 8px; }

    .ios-prompt { margin: 12px var(--pad) 0; padding: 12px 14px; background: var(--ink); color: var(--paper); display: flex; gap: 12px; align-items: flex-start; font: 400 13px/1.4 var(--sans); }
    .ios-prompt[hidden] { display: none; }
    .ios-prompt button { color: var(--paper-2); font-size: 16px; }
    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 120px); background: var(--ink); color: var(--paper); padding: 10px 16px; font: 500 13px/1.3 var(--sans); z-index: 100; transition: transform .3s ease; pointer-events: none; }
    #toast.show { transform: translate(-50%, 0); }
    @media (min-width: 700px) { .title { font-size: 48px; } .lead-story h2 { font-size: 38px; } }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <header class="mast">
      <div class="mast-top">
        <span id="dateline">—</span>
        <div class="mast-actions">
          <button id="btn-share" type="button">Share</button>
        </div>
      </div>
      <div class="title">The Aviation Briefing</div>
      <div class="mast-row">
        <div class="mast-meta"><span id="counts"></span><span id="updated"></span></div>
      </div>
      <nav class="page-nav" aria-label="Briefing sections">
        <button class="page-btn" type="button" data-page="briefing" aria-pressed="true"><span lang="tr">Günlük Brifing</span> <span class="page-cnt" id="nav-briefing-count">0</span></button>
        <button class="page-btn" type="button" data-page="reports" aria-pressed="false"><span lang="tr">Stratejik Raporlar</span> <span class="page-cnt" id="nav-reports-count">0</span></button>
        <button class="page-btn" type="button" data-page="archive" aria-pressed="false"><span lang="tr">Arşiv</span></button>
      </nav>
    </header>

    <div class="ios-prompt" id="ios-prompt" hidden>
      <span>Install on iPhone: tap <strong>Share</strong> in Safari, then <strong>Add to Home Screen</strong>.</span>
      <button type="button" id="ios-close" aria-label="Dismiss">✕</button>
    </div>
    <div class="stale" id="stale" role="status" hidden></div>
    <section id="archive-controls" class="archive-controls" aria-label="Briefing archive" hidden>
      <label for="archive-date">Archive date</label>
      <input id="archive-date" type="date" required>
      <button id="archive-prev" type="button" aria-label="Previous archive day">←</button>
      <button id="archive-next" type="button" aria-label="Next archive day">→</button>
      <p class="archive-note">Previously collected stories, including the lower-score archive. Dates follow Istanbul time.</p>
      <span id="archive-status" role="status" aria-live="polite"></span>
    </section>

    <section class="market" id="market" hidden aria-label="Markets and fuel">
      <div class="ticker-row">
        <div class="ticker" id="ticker"></div>
        <button class="mkt-toggle" id="mkt-toggle" type="button" aria-expanded="false">All indicators</button>
      </div>
      <div class="mkt-table" id="mkt-table" hidden></div>
    </section>

    <main id="content"><div class="state">Loading the briefing…</div></main>
  </div>

  <button id="new-pill" type="button" hidden></button>

  <div class="article" id="article" role="dialog" aria-modal="true" aria-label="Story" aria-hidden="true">
    <div class="art-bar">
      <button class="art-back" id="art-back" type="button">‹ Briefing</button>
      <span class="pos" id="art-pos"></span>
      <div class="art-nav">
        <button id="art-prev" type="button" aria-label="Previous story">↑</button>
        <button id="art-next" type="button" aria-label="Next story">↓</button>
      </div>
    </div>
    <div class="art-scroll" id="art-scroll"><div class="art-body" id="art-body"></div></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // Region chips follow the server's region_section; the old per-source "section" is not used.
    const SECTION_ORDER = ["Europe", "Middle East & Gulf", "Asia-Pacific", "Americas", "Africa", "Manufacturers & Supply Chain", "Regulation & Airspace", "Other"];
    const LEVEL_LABELS = { critical: "Critical", important: "Important", watch: "Watch" };
    const TOP_LEVELS = ["critical", "important"];
    const EMPTY_TEXT = "No verified developments yet today.";
    const LOADING_TEXT = "Loading today's briefing…";
    const BRIEFING_URL = "/api/briefing";
    const POLL_INTERVAL_MS = 5 * 60 * 1000;
    const MIN_POLL_GAP_MS = 60 * 1000;
    const SCROLL_TOP_THRESHOLD = 120;
    const STALE_AFTER_MINUTES = 180;
    const FRESHNESS_TICK_MS = 60 * 1000;
    const SOURCE_TYPES = { mainstream: "Mainstream", trade_media: "Aviation media", airline_ir: "Airline IR", airline_newsroom: "Official newsroom", official_social: "Official social",
      regulator: "Regulator", exchange: "Exchange filing", oem: "Manufacturer", trade: "Aviation media", tech_vendor: "Industry vendor", wire_headline: "Press headline" };
    const MARKET_ORDER = ["brent_spot", "us_gulf_coast_jet_fuel", "jet_fuel_brent_crack_spread"];   // the strip shows fuel only; the API adds FX rows only when config market.display_fx is on
    const MARKET_LABELS = {
      brent_spot: ["Brent", "Brent spot"],
      us_gulf_coast_jet_fuel: ["Jet USGC", "US Gulf Coast jet fuel"],
      jet_fuel_brent_crack_spread: ["Crack", "Jet fuel – Brent spread"]
    };

    const state = { page: "briefing", filter: "All", reportFilter: "All", data: null, stories: [], dailyStories: [], reportStories: [], order: [], articleId: null, lastTrigger: null, lastTriggerIndex: 0, pending: null, polling: false, lastPoll: 0, updatedAt: null };
    let briefingRequestId = 0;
    let archiveRequestId = 0;
    state.archiveDate = "";
    state.archiveData = null;
    const initialArchiveDate = new URLSearchParams(location.search).get("archive");
    const initialHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";

    const HTML_ESCAPE_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const $ = (id) => document.getElementById(id);
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => HTML_ESCAPE_MAP[c]); }
    function safeExternalUrl(value) {
      try {
        const parsed = new URL(String(value || ""), window.location.origin);
        if (!["http:", "https:"].includes(parsed.protocol)) return "#";
        return escapeHtml(parsed.href);
      } catch { return "#"; }
    }
    // localStorage throws in private windows and when site data is blocked; the page must work without it.
    const safeStorage = {
      get(key) { try { return localStorage.getItem(key); } catch { return null; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch { /* ignored */ } }
    };
    function storyKey(story) {
      const url = story && story.original_source && story.original_source.url;
      return String(story && (story.story_id || story.id || url || story.headline) || "story").trim().toLowerCase();
    }
    function dedupe(stories) {
      const seen = new Set();
      return stories.filter(s => { const k = storyKey(s); if (seen.has(k)) return false; seen.add(k); return true; });
    }
    function visibleStories(data) {
      const stories = Array.isArray(data.stories) ? data.stories : [];
      const unchecked = Array.isArray(data.verification_pending_stories) ? data.verification_pending_stories : [];
      // Show collected titles immediately, without reviving unsupported analysis or inventing source URLs.
      return dedupe(stories.concat(unchecked.map(item => ({
        story_id: item.story_id, headline: item.headline, language: langOf(item),
        original_source: { source_name: item.reported_source }, sources: [], badges: [],
        source_verification_status: "unverified", narrative_status: "unavailable"
      }))));
    }
    function isUnverified(story) { return story.source_verification_status === "unverified"; }
    function isStrategicReport(story) { return Boolean(story && story.is_strategic_report); }
    function sectionOf(story) { return story.region_section || "Other"; }
    function badgeSet(story) { return new Set(Array.isArray(story.badges) ? story.badges : []); }
    function isBreaking(story) { return badgeSet(story).has("breaking"); }
    function isTopLevel(story) { return TOP_LEVELS.includes(story.level); }
    function isPending(story) { return story.narrative_status === "pending"; }
    function langOf(story) { return story && story.language === "tr" ? "tr" : "en"; }
    function sourcesOf(story) { return Array.isArray(story.sources) ? story.sources : []; }
    function sourceCount(story) { return Math.max(Number(story.source_count) || 0, sourcesOf(story).length); }
    function tagsHtml(story, withRegion) {
      const badges = state.page === "archive" ? new Set() : badgeSet(story);
      const level = LEVEL_LABELS[story.level];
      const isFlash = Boolean(story && (story.is_flash_alert || (story.badges && story.badges.includes("flash_alert"))));
      return [
        isUnverified(story) ? `<span lang="en">Source not checked</span>` : "",
        isFlash ? `<span lang="en" class="flash-alert-badge">⚡ FLASH ALERT</span>` : "",
        level ? `<span lang="en" class="lvl-${escapeHtml(story.level)}">${level}</span>` : "",
        badges.has("breaking") ? `<span lang="en" class="breaking">Breaking</span>` : "",
        badges.has("new") ? `<span lang="en" class="new">New</span>` : "",
        badges.has("updated") ? `<span lang="en" class="updated">Updated</span>` : "",
        withRegion ? `<span lang="en">${escapeHtml(sectionOf(story))}</span>` : ""
      ].join("");
    }
    function sectionRank(name) { const i = SECTION_ORDER.indexOf(name); return i === -1 ? SECTION_ORDER.length : i; }
    function tone(impact) {
      const r = String(impact || "").toLowerCase();
      if (/neg|adverse|risk|cost|headwind|pressure|disrupt/.test(r)) return "down";
      if (/pos|growth|opp|hedged/.test(r)) return "up";
      return "";
    }
    function fmtNumber(v, digits) { const n = Number(v); return Number.isFinite(n) ? new Intl.NumberFormat("en-GB", { maximumFractionDigits: digits }).format(n) : "–"; }
    function fmtChange(v) { const n = Number(v); if (!Number.isFinite(n)) return ""; return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1) + "%"; }
    function showToast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); }

    async function loadBriefing(requestLatest = false) {
      const requestId = ++briefingRequestId;
      const keepsCurrent = requestLatest && state.data;
      if (!keepsCurrent) $("content").innerHTML = `<div class="state">${LOADING_TEXT}</div>`;
      try {
        const cacheBuster = requestLatest ? `?view=${Date.now()}` : "";
        const res = await fetch(`${BRIEFING_URL}${cacheBuster}`, {
          cache: requestLatest ? "no-store" : "default",
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        if (!(res.headers.get("content-type") || "").includes("application/json")) throw new Error("Invalid API response");
        const data = await res.json();
        if (requestId !== briefingRequestId) return;
        render(data);
      } catch (err) {
        if (requestId !== briefingRequestId) return;
        console.error("Briefing load failed:", err);
        if (keepsCurrent) { showToast("Couldn't refresh — showing the last briefing."); return; }
        $("content").innerHTML = `<div class="state"><strong>The briefing couldn't be loaded.</strong>Please try again shortly.</div>`;
      }
    }

    function updateMastCount() {
      if (state.page === "archive") {
        $("counts").textContent = `${state.stories.length} archived stories`;
        return;
      }
      const stories = state.dailyStories;
      const breakingCount = stories.filter(isBreaking).length;
      if (state.page === "reports") {
        $("counts").textContent = `${state.reportStories.length} stratejik rapor & küresel endeks`;
      } else {
        $("counts").textContent = `${stories.length} ${stories.length === 1 ? "story" : "stories"} · ${breakingCount} breaking`;
      }
    }

    function setPage(pageName) {
      if (!["briefing", "reports", "archive"].includes(pageName)) return;
      state.page = pageName;
      archiveRequestId++;
      $("archive-controls").hidden = pageName !== "archive";
      document.querySelectorAll("[data-page]").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.page === pageName));
      });
      $("art-back").textContent = pageName === "archive" ? "‹ Archive" : pageName === "reports" ? "‹ Raporlar" : "‹ Briefing";
      if (pageName === "archive") { loadArchive(state.archiveDate || previousDate(istanbulToday())); return; }
      const url = new URL(location.href);
      url.searchParams.delete("archive");
      history.replaceState(null, "", url.pathname + url.search + url.hash);
      if (state.data) render(state.data);
      else loadBriefing();
    }

    function istanbulToday() {
      const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Istanbul", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
      const field = kind => parts.find(part => part.type === kind).value;
      return `${field("year")}-${field("month")}-${field("day")}`;
    }
    function shiftDate(value, days) {
      const date = new Date(value + "T12:00:00Z");
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    }
    function previousDate(value) { return shiftDate(value, -1); }
    function validArchiveDate(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(value || "") && Number.isFinite(Date.parse(value + "T00:00:00Z"))
        && new Date(value + "T00:00:00Z").toISOString().slice(0, 10) === value && value <= istanbulToday();
    }
    function renderArchive(data) {
      state.archiveData = data;
      state.stories = visibleStories(data);
      state.filter = "All";
      updateMastCount();
      $("archive-status").textContent = `${state.stories.length} stories collected for this day.`;
      renderList();
      openLinkedStory();
    }
    async function loadArchive(dateText) {
      if (!validArchiveDate(dateText)) { $("archive-status").textContent = "Choose a valid date up to today."; return; }
      const requestId = ++archiveRequestId;
      state.archiveDate = dateText;
      state.archiveData = null;
      state.stories = [];
      state.order = [];
      $("archive-date").value = dateText;
      $("archive-date").max = istanbulToday();
      $("archive-next").disabled = dateText >= istanbulToday();
      $("dateline").textContent = `Archive · ${dateText}`;
      $("updated").textContent = "Historical briefing";
      $("stale").hidden = true;
      $("market").hidden = true;
      $("new-pill").hidden = true;
      $("archive-status").textContent = "Loading archive…";
      $("counts").textContent = "Archive";
      $("content").innerHTML = `<div class="state">Loading the selected day's stories…</div>`;
      const url = new URL(location.href);
      url.searchParams.set("archive", dateText);
      history.replaceState(null, "", url.pathname + url.search + url.hash);
      try {
        const query = new URLSearchParams({ date: dateText, include_low: "1" });
        const response = await fetch(`${BRIEFING_URL}?${query}`, { headers: { "Accept": "application/json" } });
        if (requestId !== archiveRequestId || state.page !== "archive") return;
        if (response.status === 404) {
          $("archive-status").textContent = "No archive was saved for this date.";
          $("content").innerHTML = `<div class="state">No saved briefing for ${escapeHtml(dateText)}. Choose another day.</div>`;
          updateMastCount();
          return;
        }
        if (!response.ok || !(response.headers.get("content-type") || "").includes("application/json")) throw new Error("Archive request failed");
        const data = await response.json();
        if (requestId !== archiveRequestId || state.page !== "archive") return;
        if (data.date !== dateText || !Array.isArray(data.stories)) throw new Error("Invalid archive response");
        renderArchive(data);
      } catch (error) {
        if (requestId !== archiveRequestId || state.page !== "archive") return;
        $("archive-status").textContent = "Archive couldn't be loaded. Choose the date again to retry.";
        $("content").innerHTML = `<div class="state">The archive couldn't be loaded. Please try again.</div>`;
        console.error("Archive load failed:", error);
      }
    }

    function render(data) {
      state.data = data;
      state.pending = null;
      $("new-pill").hidden = true;
      const allStories = visibleStories(data);
      const dailyStories = allStories.filter(s => !isStrategicReport(s));
      const reportStories = allStories.filter(isStrategicReport);
      state.dailyStories = dailyStories;
      state.reportStories = reportStories;
      const stories = state.page === "reports" ? reportStories : dailyStories;
      if (state.page !== "archive") state.stories = stories;
      $("nav-briefing-count").textContent = String(dailyStories.length);
      $("nav-reports-count").textContent = String(reportStories.length);
      if (state.page === "archive") return;

      const sections = new Set(dailyStories.map(sectionOf));
      if (state.filter !== "All" && !sections.has(state.filter)) state.filter = "All";
      const reportSources = new Set(reportStories.map(sourceName));
      if (state.reportFilter !== "All" && !reportSources.has(state.reportFilter)) state.reportFilter = "All";

      $("dateline").textContent = [data.date_str, data.time_str].filter(Boolean).join(" · ") || "—";
      updateMastCount();
      state.updatedAt = parseTime(data.last_pipeline_run_at || data.generated_at);
      renderFreshness();

      renderMarket(data.market);
      renderList();
      if (state.articleId) renderArticle();
      openLinkedStory();
    }

    function parseTime(value) { const t = Date.parse(value || ""); return Number.isFinite(t) ? t : null; }
    function ageText(minutes) {
      if (minutes < 1) return "just now";
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.floor(minutes / 60);
      return `${hours} h${minutes % 60 ? ` ${minutes % 60} min` : ""} ago`;
    }
    // The band explains why the data may be old: the last pipeline run failed (status "stale") or no run reached the site for a while.
    function renderFreshness() {
      if (state.page === "archive") return;
      const data = state.data || {};
      const minutes = state.updatedAt === null ? null : Math.max(0, Math.round((Date.now() - state.updatedAt) / 60000));
      $("updated").textContent = minutes === null ? "" : `Updated ${ageText(minutes)}`;
      const lines = [];
      if (data.status === "stale") {
        lines.push("The latest update didn't complete. Showing the last successful briefing" + (state.updatedAt !== null ? ` from ${new Date(state.updatedAt).toUTCString().slice(5, 22)} UTC.` : "."));
      }
      if (minutes !== null && minutes > STALE_AFTER_MINUTES) lines.push(`This briefing was last updated ${ageText(minutes)}. Newer stories may be missing.`);
      const band = $("stale");
      band.innerHTML = lines.map(l => `<div>${escapeHtml(l)}</div>`).join("");
      band.hidden = !lines.length;
    }

    function renderReportsList() {
      const { reportFilter } = state;
      const reports = state.reportStories;
      if (!reports.length) {
        state.order = [];
        $("content").innerHTML = `<div class="state">Henüz stratejik rapor bulunmuyor.</div><div class="end">— Stratejik Raporlar sonu —</div>`;
        return;
      }
      const counts = {};
      reports.forEach(s => { const k = sourceName(s); counts[k] = (counts[k] || 0) + 1; });
      const pubNames = Object.keys(counts);
      const visible = reportFilter === "All" ? reports : reports.filter(s => sourceName(s) === reportFilter);
      state.order = visible.slice();

      let n = 0;
      const reportRow = (s) => {
        n++;
        const count = sourceCount(s);
        const meta = [sourceName(s), count > 1 ? `${count} sources` : "", s.published_at || ""].filter(Boolean).map(escapeHtml).join(" · ");
        const body = isPending(s) ? `<p class="pending" lang="en">Analysis pending</p>` : (s.why_it_matters ? `<p lang="${langOf(s)}">${escapeHtml(s.why_it_matters)}</p>` : (s.lead ? `<p lang="${langOf(s)}">${escapeHtml(s.lead)}</p>` : ""));
        const dps = (Array.isArray(s.data_points) ? s.data_points : []).slice(0, 4).map(d => `<span class="report-dp-chip">${escapeHtml(d)}</span>`).join("");
        return `<button class="row" type="button" data-open="${escapeHtml(storyKey(s))}">
          <span class="row-num">${String(n).padStart(2, "0")}</span>
          <span class="row-body">
            <span class="kicker"><span class="report-badge-pill">STRATEGIC REPORT</span> · <strong>${escapeHtml(sourceName(s))}</strong></span>
            <h3 lang="${langOf(s)}">${escapeHtml(s.headline)}</h3>
            ${body}
            ${dps ? `<div class="report-dps-bar" lang="${langOf(s)}">${dps}</div>` : ""}
            <span class="src" lang="en">${meta} · <strong class="report-view-link">1-Page Summary →</strong></span>
          </span>
        </button>`;
      };

      let html = `<div class="report-intro" lang="tr"><strong>Stratejik Raporlar, Küresel Tahminler &amp; Benchmark Endeksleri</strong> — Boeing CMO, Airbus GMF, EUROCONTROL Tahminleri, ICAO, FAA, EASA, IATA, ACI World, Oliver Wyman MRO Forecast, OAG Megahubs, IdeaWorksCompany, Cirium ve CAPA raporları. Yeni yayımlanan tüm stratejik raporlar otomatik olarak bu sayfaya eklenir.</div>`;
      html += `<nav class="filters" aria-label="Filter by publisher"><div class="filters-inner">
        ${[["All", reports.length]].concat(pubNames.map(name => [name, counts[name]])).map(([name, c]) =>
          `<button class="chip" type="button" data-report-filter="${escapeHtml(name)}" aria-pressed="${name === reportFilter}">${escapeHtml(name)}<span>${c}</span></button>`).join("")}
      </div></nav>`;
      html += `<section class="group"><div lang="en" class="group-head eyebrow">Strategic Outlooks &amp; Benchmark Reports · ${visible.length}</div>${visible.map(reportRow).join("")}</section>`;
      html += `<div class="end">— End of strategic reports —</div>`;
      $("content").innerHTML = html;
    }

    function renderList() {
      if (state.page === "reports") { renderReportsList(); return; }
      const { filter } = state;
      const stories = state.stories;
      if (!stories.length) { state.order = []; $("content").innerHTML = `<div class="state">${state.page === "archive" ? "No eligible stories in this saved briefing." : EMPTY_TEXT}</div><div class="end">— End of briefing —</div>`; return; }
      const counts = {};
      stories.forEach(s => { const k = sectionOf(s); counts[k] = (counts[k] || 0) + 1; });
      const sectionNames = Object.keys(counts).sort((a, b) => sectionRank(a) - sectionRank(b));

      // "All" opens with a region-independent Critical & Important block (a short list of the top stories), then every story
      // grouped by region. A region filter shows only that region's group, at every level. The reading order (prev/next)
      // is the region order, so each story appears once in it even though the block repeats the top ones.
      const showBlock = filter === "All";
      const block = showBlock ? stories.filter(isTopLevel) : [];
      const lead = block[0] || null;
      const blockRest = block.slice(1);
      const groups = (showBlock ? sectionNames : [filter]).map(name => ({ name, items: stories.filter(s => sectionOf(s) === name) })).filter(g => g.items.length);
      state.order = [].concat(...groups.map(g => g.items));

      let n = 0;
      const compactRow = (s) => {
        const count = sourceCount(s);
        const meta = [sourceName(s), count > 1 ? `${count} sources` : ""].filter(Boolean).map(escapeHtml).join(" · ");
        return `<button class="row compact" type="button" data-open="${escapeHtml(storyKey(s))}">
          <span class="row-num" aria-hidden="true">•</span>
          <span class="row-body">
            <span class="kicker">${tagsHtml(s, true)}</span>
            <h3 lang="${langOf(s)}">${escapeHtml(s.headline)}</h3>
            <span class="src" lang="en">${meta}</span>
          </span>
        </button>`;
      };
      const row = (s, withRegion) => {
        n++;
        const tags = tagsHtml(s, withRegion);
        const count = sourceCount(s);
        const meta = [sourceName(s), count > 1 ? `${count} sources` : "", s.published_at || ""].filter(Boolean).map(escapeHtml).join(" · ");
        const body = isPending(s) ? `<p class="pending" lang="en">Analysis pending</p>` : (s.why_it_matters ? `<p lang="${langOf(s)}">${escapeHtml(s.why_it_matters)}</p>` : "");
        return `<button class="row" type="button" data-open="${escapeHtml(storyKey(s))}">
          <span class="row-num">${String(n).padStart(2, "0")}</span>
          <span class="row-body">
            ${tags ? `<span class="kicker">${tags}</span>` : ""}
            <h3 lang="${langOf(s)}">${escapeHtml(s.headline)}</h3>
            ${body}
            <span class="src" lang="en">${meta}</span>
          </span>
        </button>`;
      };

      let html = stories.length ? "" : `<div class="state">${EMPTY_TEXT}</div>`;
      if (block.length) html += `<section class="group"><div lang="en" class="group-head eyebrow">Critical &amp; Important · ${block.length}</div></section>`;
      if (lead) {
        const count = sourceCount(lead);
        html += `<article class="lead-story" role="button" tabindex="0" data-open="${escapeHtml(storyKey(lead))}">
          <div class="kicker">${tagsHtml(lead, true)}</div>
          <h2 lang="${langOf(lead)}">${escapeHtml(lead.headline)}</h2>
          ${isPending(lead) ? `<p class="why" lang="en">Analysis pending</p>` : (lead.why_it_matters ? `<p class="why" lang="${langOf(lead)}">${escapeHtml(lead.why_it_matters)}</p>` : "")}
          <div class="meta" lang="en"><span>${escapeHtml([sourceName(lead), count > 1 ? `${count} sources` : ""].filter(Boolean).join(" · "))}</span><strong>Read the analysis →</strong></div>
        </article>`;
      }
      if (blockRest.length) html += `<section class="group">${blockRest.map(compactRow).join("")}</section>`;
      if (stories.length) html += `<nav class="filters" aria-label="Filter by region"><div class="filters-inner">
        ${[["All", stories.length]].concat(sectionNames.map(name => [name, counts[name]])).map(([name, c]) =>
          `<button class="chip" type="button" data-filter="${escapeHtml(name)}" aria-pressed="${name === filter}">${escapeHtml(name)}<span>${c}</span></button>`).join("")}
      </div></nav>`;
      groups.forEach(g => {
        html += `<section class="group"><div lang="en" class="group-head eyebrow">${escapeHtml(g.name)}</div>${g.items.map(s => row(s, false)).join("")}</section>`;
      });
      html += `<div class="end">— End of briefing —</div>`;
      $("content").innerHTML = html;
    }

    function sourceName(s) { const o = s.original_source || {}; return o.source_name || o.title || "Verified source"; }

    function renderMarket(market) {
      const items = (market && Array.isArray(market.items) ? market.items : []).slice()
        .sort((a, b) => (MARKET_ORDER.indexOf(a.series_id) + 99) % 99 - (MARKET_ORDER.indexOf(b.series_id) + 99) % 99);
      const label = (it) => {
        if (MARKET_LABELS[it.series_id]) return MARKET_LABELS[it.series_id];
        const m = /^fx_usd_([a-z]{3})$/.exec(it.series_id || "");
        return m ? [`USD/${m[1].toUpperCase()}`, `USD / ${m[1].toUpperCase()}`] : [it.name || it.series_id, it.name || it.series_id];
      };
      if (!items.length) { $("market").hidden = true; return; }      // nothing to show: no empty strip
      const present = new Set(items.map(it => it.series_id));
      const missing = MARKET_ORDER.filter(id => !present.has(id)).map(id => label({ series_id: id })[0]);
      const chg = (it) => Number(it.changes && it.changes.daily_pct);
      const cls = (v) => Number.isFinite(v) ? (v >= 0 ? "up" : "down") : "";
      const sources = [...new Set(items.map(it => String(it.source || "").split(";")[0].trim()).filter(Boolean))];
      const sourceNote = sources.length ? `Sources: ${escapeHtml(sources.join(" · "))}. ` : "";
      $("ticker").innerHTML = items.map(it => `<span>${escapeHtml(label(it)[0])} ${fmtNumber(it.value, 3)} <span class="${cls(chg(it))}">${fmtChange(chg(it))}</span></span>`).join("")
        + (missing.length ? `<span class="mkt-miss">${missing.length} unavailable</span>` : "");
      $("mkt-table").innerHTML = items.map(it => {
        const age = Number(it.age_days) || 0;
        const asOf = it.as_of ? `${it.as_of}${it.carried_forward && age > 0 ? ` · ${age} d old` : ""}` : "";
        return `<div class="mkt-line">
          <span class="mkt-name">${escapeHtml(label(it)[1])}<small>${escapeHtml(asOf)}</small></span>
          ${sparkline(it.sparkline)}
          <span class="mkt-val">${fmtNumber(it.value, 3)} <small>${escapeHtml(it.unit || "")}</small></span>
          <span class="mkt-chg ${cls(chg(it))}">${fmtChange(chg(it))}</span>
        </div>`;
      }).join("")
        + (missing.length ? `<p class="mkt-note">Unavailable right now: ${escapeHtml(missing.join(", "))}.</p>` : "")
        + `<p class="mkt-note">${sourceNote}Jet fuel is the US Gulf Coast series, not a global price.${market.iata_monitor && market.iata_monitor.url ? ` <a href="${safeExternalUrl(market.iata_monitor.url)}" target="_blank" rel="noopener noreferrer">IATA Jet Fuel Price Monitor ↗</a>` : ""}</p>`;
      $("market").hidden = false;
    }
    function sparkline(points) {
      const v = (Array.isArray(points) ? points : []).map(p => Number(p && p.value)).filter(Number.isFinite);
      if (v.length < 2) return `<span></span>`;
      const mn = Math.min(...v), sp = Math.max(...v) - mn || 1;
      const pts = v.map((x, i) => `${(i / (v.length - 1) * 100).toFixed(1)},${(26 - (x - mn) / sp * 24).toFixed(1)}`).join(" ");
      return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#1B1A17" stroke-width="1.3" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
    }

    function openArticle(key, push = true) {
      if (!state.articleId) rememberTrigger(key);
      state.articleId = key;
      renderArticle();
      $("article").classList.add("open");
      $("article").setAttribute("aria-hidden", "false");
      $("wrap").inert = true;                       // keyboard and screen-reader focus stay inside the open story
      document.body.classList.add("article-open");
      if (push) history.pushState({ article: key }, "", "#" + encodeURIComponent(key));
      focusArticleHeading();
    }
    // The same story can appear twice (top block and its region), so remember which copy opened it.
    function rowsFor(key) { return [...document.querySelectorAll("[data-open]")].filter(el => el.dataset.open === key && !$("article").contains(el)); }
    function rememberTrigger(key) {
      state.lastTrigger = document.activeElement;
      state.lastTriggerIndex = Math.max(0, rowsFor(key).indexOf(document.activeElement));
    }
    function closeArticle(fromPop = false) {
      const key = state.articleId;
      state.articleId = null;
      $("article").classList.remove("open");
      $("article").setAttribute("aria-hidden", "true");
      $("wrap").inert = false;
      document.body.classList.remove("article-open");
      returnFocus(key);
      if (!fromPop && history.state && history.state.article) history.back();
      setTimeout(checkForNewVersion, 0);
    }
    function focusArticleHeading() {
      const heading = $("art-body").querySelector("h1");
      if (heading) heading.focus({ preventScroll: true });
    }
    // Closing returns focus to the row that opened the story (the list is re-rendered, so look the row up by key).
    function returnFocus(key) {
      const rows = key ? rowsFor(key) : [];
      const target = state.lastTrigger && state.lastTrigger.isConnected && state.lastTrigger !== document.body ? state.lastTrigger : (rows[state.lastTriggerIndex] || rows[0]);
      if (target) target.focus({ preventScroll: true });
      state.lastTrigger = null;
    }
    function renderArticle() {
      const i = state.order.findIndex(s => storyKey(s) === state.articleId);
      if (i < 0) { closeArticle(); return; }
      const s = state.order[i], next = state.order[i + 1];
      const lang = langOf(s);
      const src = s.original_source || {};
      const type = isUnverified(s) ? "Source not checked" : (SOURCE_TYPES[src.source_type] || "Verified source");
      const analysis = (s.detailed_analysis || []).map(b => `<li>${escapeHtml(b)}</li>`).join("");
      const dps = (s.data_points || []).map(d => `<span>${escapeHtml(d)}</span>`).join("");
      const exposure = (Array.isArray(s.market_exposure) ? s.market_exposure : []).map(e =>
        `<div class="exp"><div class="exp-head"><span>${escapeHtml(e.carrier || "Stakeholder")}</span><span lang="en" class="${tone(e.impact)}">${escapeHtml(e.impact || "Neutral")}</span></div>${e.details ? `<p lang="${lang}">${escapeHtml(e.details)}</p>` : ""}</div>`).join("");
      const strategic = s.strategic_impact || "";
      const coverage = sourcesOf(s);
      const count = sourceCount(s);
      const coverageHtml = coverage.length ? `<div style="display:flex;flex-direction:column;gap:8px"><span lang="en" class="eyebrow">${count > 1 ? `Covered by ${count} sources` : "Source"}</span><ul class="sources">${coverage.map(c =>
        `<li lang="${c.language === "tr" ? "tr" : "en"}"><span class="by">${escapeHtml(c.name || "Source")}</span> — <a href="${safeExternalUrl(c.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(c.title || c.url || "Read article")} ↗</a></li>`).join("")}</ul></div>` : "";
      $("art-pos").textContent = `${i + 1} of ${state.order.length}`;
      $("art-prev").disabled = i === 0;
      $("art-next").disabled = !next;

      if (isStrategicReport(s)) {
        const kpiItems = (s.data_points || []).slice(0, 6).map(d =>
          `<div class="report-kpi-card"><span class="report-kpi-val">${escapeHtml(d)}</span><span class="report-kpi-label">Projection / Stat</span></div>`
        ).join("");
        const analysisItems = (s.detailed_analysis || []).map(b => `<li>${escapeHtml(b)}</li>`).join("");
        const exposure = (Array.isArray(s.market_exposure) ? s.market_exposure : []).map(e =>
          `<div class="exp"><div class="exp-head"><span>${escapeHtml(e.carrier || "Stakeholder")}</span><span lang="en" class="${tone(e.impact)}">${escapeHtml(e.impact || "Neutral")}</span></div>${e.details ? `<p lang="${lang}">${escapeHtml(e.details)}</p>` : ""}</div>`).join("");

        $("art-body").innerHTML = `
          <div class="kicker"><span class="report-badge-pill">STRATEGIC REPORT</span> · <strong>${escapeHtml(sourceName(s))}</strong>${s.published_at ? ` · ${escapeHtml(s.published_at)}` : ""}</div>
          <h1 tabindex="-1" lang="${lang}">${escapeHtml(s.headline)}</h1>
          <div class="art-src" lang="en">Flagship Outlook &amp; Benchmark Publication · ${escapeHtml(sourceName(s))}${src.official ? " · Official Report" : ""}${count > 1 ? ` · ${count} sources` : ""}</div>
          ${isPending(s) ? `<p class="art-pending" lang="en">Analysis pending — the executive summary appears after the next update.</p>` : ""}
          ${s.why_it_matters ? `<div class="report-why"><span lang="en" class="eyebrow">Executive Summary</span><p lang="${lang}">${escapeHtml(s.why_it_matters)}</p></div>` : ""}
          ${s.lead ? `<p class="art-lead" lang="${lang}">${escapeHtml(s.lead)}</p>` : ""}
          ${kpiItems ? `<div class="report-kpi-section"><span lang="en" class="eyebrow">Key Metrics &amp; Forecast Indicators</span><div class="report-kpi-grid">${kpiItems}</div></div>` : ""}
          ${analysisItems ? `<div class="report-takeaways"><span lang="en" class="eyebrow">Key Findings &amp; Industry Projections</span><ul class="report-bullets" lang="${lang}">${analysisItems}</ul></div>` : ""}
          ${strategic || exposure ? `<div class="impact"><span lang="en" class="eyebrow">Macro &amp; Commercial Market Outlook</span>${strategic ? `<p lang="${lang}">${escapeHtml(strategic)}</p>` : ""}${exposure}</div>` : ""}
          ${coverageHtml}
          ${src.url ? `<a class="report-cta-btn" lang="en" href="${safeExternalUrl(src.url)}" target="_blank" rel="noopener noreferrer"><span>View Official Report &amp; Data Tables (${escapeHtml(sourceName(s))})</span> <span aria-hidden="true">↗</span></a>` : ""}
          ${next ? `<button class="next" type="button" data-open="${escapeHtml(storyKey(next))}" data-replace="1"><span lang="en" class="eyebrow" style="color:var(--muted)">Next strategic report ↓</span><span lang="${langOf(next)}">${escapeHtml(next.headline)}</span></button>` : ""}`;
      } else {
        const analysis = (s.detailed_analysis || []).map(b => `<li>${escapeHtml(b)}</li>`).join("");
        const dps = (s.data_points || []).map(d => `<span>${escapeHtml(d)}</span>`).join("");
        const exposure = (Array.isArray(s.market_exposure) ? s.market_exposure : []).map(e =>
          `<div class="exp"><div class="exp-head"><span>${escapeHtml(e.carrier || "Stakeholder")}</span><span lang="en" class="${tone(e.impact)}">${escapeHtml(e.impact || "Neutral")}</span></div>${e.details ? `<p lang="${lang}">${escapeHtml(e.details)}</p>` : ""}</div>`).join("");

        $("art-body").innerHTML = `
          <div class="kicker">${tagsHtml(s, true)}</div>
          <h1 tabindex="-1" lang="${lang}">${escapeHtml(s.headline)}</h1>
          <div class="art-src" lang="en">${escapeHtml(sourceName(s))} · ${type}${src.official ? " · Official" : ""}${count > 1 ? ` · ${count} sources` : ""}${s.published_at ? " · " + escapeHtml(s.published_at) : ""}</div>
          ${s.is_flash_alert ? `<div class="flash-alert-banner" lang="tr"><strong>⚡ Sektör Radarı (Kısa Sinyal):</strong> Kritik havacılık analistleri ve sektör radarı kaynaklı hızlı gelişme.</div>` : ""}
          ${s.basis === "headline_only" ? `<p class="art-src" lang="en">Based on the publisher's headline and short summary only; no figures beyond the source's own.</p>` : ""}
          ${isUnverified(s) ? `<p class="art-src" lang="en">This collected headline has not been independently checked. No verified publisher link or analysis is available; please check the named publisher yourself.</p>` : ""}
          ${isPending(s) ? `<p class="art-pending" lang="en">Analysis pending — the written analysis appears after the next update.</p>` : ""}
          ${s.why_it_matters ? `<div class="art-why"><span lang="en" class="eyebrow">Why it matters</span><p lang="${lang}">${escapeHtml(s.why_it_matters)}</p></div>` : ""}
          ${s.lead ? `<p class="art-lead" lang="${lang}">${escapeHtml(s.lead)}</p>` : ""}
          ${analysis ? `<div style="display:flex;flex-direction:column;gap:8px"><span lang="en" class="eyebrow">Analysis</span><ul class="bullets" lang="${lang}">${analysis}</ul></div>` : ""}
          ${dps ? `<div class="datapoints" lang="${lang}">${dps}</div>` : ""}
          ${strategic || exposure ? `<div class="impact"><span lang="en" class="eyebrow">Strategic &amp; market impact</span>${strategic ? `<p lang="${lang}">${escapeHtml(strategic)}</p>` : ""}${exposure}</div>` : ""}
          ${coverageHtml}
          ${src.url ? `<a class="art-link" lang="en" href="${safeExternalUrl(src.url)}" target="_blank" rel="noopener noreferrer">Original source: ${escapeHtml(src.title || "Read full article")}${src.source_name ? " — " + escapeHtml(src.source_name) : ""} ↗</a>` : ""}
          ${next ? `<button class="next" type="button" data-open="${escapeHtml(storyKey(next))}" data-replace="1"><span lang="en" class="eyebrow" style="color:var(--muted)">Next story ↓</span><span lang="${langOf(next)}">${escapeHtml(next.headline)}</span></button>` : ""}`;
      }
      $("art-scroll").scrollTop = 0;
    }
    function stepArticle(delta, moveFocus = false) {
      const i = state.order.findIndex(s => storyKey(s) === state.articleId);
      const target = state.order[i + delta];
      if (!target) return;
      state.articleId = storyKey(target);
      history.replaceState({ article: state.articleId }, "", "#" + encodeURIComponent(state.articleId));
      renderArticle();
      if (moveFocus) focusArticleHeading();
    }
    // A shared link (#story-id) opens that story once the list has loaded; an id that is no longer in this view is dropped quietly.
    let linkedStoryHandled = !initialHash;
    function openLinkedStory() {
      if (linkedStoryHandled) return;
      linkedStoryHandled = true;
      const key = initialHash.trim().toLowerCase();
      history.replaceState(null, "", location.pathname + location.search);
      if (state.order.some(s => storyKey(s) === key)) { openArticle(key, true); return; }
      if (state.reportStories.some(s => storyKey(s) === key)) {
        setPage("reports");
        openArticle(key, true);
        return;
      }
      showToast("That story is no longer in this briefing.");
    }

    function shareBriefing() {
      const data = state.page === "archive" ? state.archiveData : state.data;
      if (!data) return;
      let text = `${data.heading || "The Aviation Briefing"}\n${state.page === "archive" ? `Archive · ${state.archiveDate}` : data.intro_sentence || ""}\n`;
      const order = state.order.length ? state.order : state.stories;
      order.forEach(s => {
        text += `\n• ${s.headline}\n`;
        if (s.why_it_matters) text += `  ${s.why_it_matters}\n`;
        if (s.original_source && s.original_source.url) text += `  ${s.original_source.url}\n`;
      });
      const copy = () => navigator.clipboard.writeText(text).then(() => showToast("Briefing copied to clipboard.")).catch(() => showToast("Couldn't copy."));
      if (navigator.share) navigator.share({ title: data.heading || "The Aviation Briefing", text }).catch(copy);
      else copy();
    }

    // A home-screen app is frozen when it goes to the background and resumes with the OLD page code, so a
    // new deployment never reaches it. The page therefore compares its own source with the server's when it
    // returns to the foreground and every few minutes, and reloads itself when they differ.
    let pageFingerprint = null;
    function fingerprint(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
      return (hash >>> 0).toString(16) + ":" + text.length;
    }
    async function checkForNewVersion() {
      try {
        const res = await fetch(location.pathname, { cache: "no-store" });
        if (!res.ok) return;
        const current = fingerprint(await res.text());
        if (pageFingerprint === null) { pageFingerprint = current; return; }
        // Never replace the page under a reader who has a story open; the next check applies it.
        if (current !== pageFingerprint && !state.articleId) location.reload();
      } catch (err) {
        console.error("Version check failed:", err);
      }
    }
    async function backgroundRefresh() {
      await checkForNewVersion();
      await pollBriefing();
    }

    // New stories are added without a reload: poll quietly, insert at once when the reader is at the top,
    // otherwise offer a "new stories" button so the reading position never jumps.
    async function pollBriefing() {
      if (document.hidden || state.polling || !state.data || state.page === "archive") return;
      state.polling = true;
      state.lastPoll = Date.now();
      try {
        const res = await fetch(BRIEFING_URL, { cache: "default", headers: { "Accept": "application/json" } });
        if (!res.ok || !(res.headers.get("content-type") || "").includes("application/json")) return;
        const data = await res.json();
        applyPolled(data);
      } catch (err) {
        console.error("Background refresh failed:", err);
      } finally {
        state.polling = false;
      }
    }
    function applyPolled(data) {
      if (state.page === "archive") return;
      const known = new Set(state.dailyStories.concat(state.reportStories).map(storyKey));
      const arrived = visibleStories(data).filter(s => !known.has(storyKey(s)));
      const atTop = window.scrollY < SCROLL_TOP_THRESHOLD && !state.articleId;
      const label = `${arrived.length} new ${arrived.length === 1 ? "story" : "stories"}`;
      if (!arrived.length) { if (atTop) render(data); return; }
      if (atTop) { render(data); showToast(`${label} added`); return; }
      state.pending = data;
      $("new-pill").textContent = `↑ ${label}`;
      $("new-pill").hidden = false;
    }

    document.addEventListener("DOMContentLoaded", () => {
      $("new-pill").addEventListener("click", () => {
        if (state.articleId) closeArticle();
        if (state.pending) render(state.pending);
        window.scrollTo(0, 0);
      });
      setInterval(backgroundRefresh, POLL_INTERVAL_MS);
      setInterval(renderFreshness, FRESHNESS_TICK_MS);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) return;
        renderFreshness();
        checkForNewVersion();
        if (Date.now() - state.lastPoll > MIN_POLL_GAP_MS) pollBriefing();
      });
      checkForNewVersion();
      $("btn-share").addEventListener("click", shareBriefing);
      document.querySelector(".page-nav").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-page]");
        if (btn) setPage(btn.dataset.page);
      });
      $("archive-date").addEventListener("change", (e) => loadArchive(e.target.value));
      $("archive-prev").addEventListener("click", () => loadArchive(previousDate(state.archiveDate)));
      $("archive-next").addEventListener("click", () => loadArchive(shiftDate(state.archiveDate, 1)));
      $("mkt-toggle").addEventListener("click", () => {
        const table = $("mkt-table"), open = table.hidden;
        table.hidden = !open;
        $("mkt-toggle").textContent = open ? "Hide" : "All indicators";
        $("mkt-toggle").setAttribute("aria-expanded", String(open));
      });
      $("content").addEventListener("click", (e) => {
        const reportChip = e.target.closest("[data-report-filter]");
        if (reportChip) {
          state.reportFilter = reportChip.dataset.reportFilter;
          renderList();
          const pressed = [...document.querySelectorAll("[data-report-filter]")].find(el => el.dataset.reportFilter === state.reportFilter);
          if (pressed) pressed.focus({ preventScroll: true });
          return;
        }
        const chip = e.target.closest("[data-filter]");
        if (chip) {
          state.filter = chip.dataset.filter;
          const top = document.querySelector(".filters").getBoundingClientRect().top + window.scrollY;
          renderList();
          if (window.scrollY > top) window.scrollTo(0, top);
          const pressed = [...document.querySelectorAll("[data-filter]")].find(el => el.dataset.filter === state.filter);
          if (pressed) pressed.focus({ preventScroll: true });
          return;
        }
        const item = e.target.closest("[data-open]");
        if (item) openArticle(item.dataset.open);
      });
      $("content").addEventListener("keydown", (e) => {
        const lead = e.target.closest(".lead-story");
        if (lead && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openArticle(lead.dataset.open); }
      });
      $("art-body").addEventListener("click", (e) => { const n = e.target.closest("[data-open]"); if (n) stepArticle(1, true); });
      $("art-back").addEventListener("click", () => closeArticle());
      $("art-prev").addEventListener("click", () => stepArticle(-1));
      $("art-next").addEventListener("click", () => stepArticle(1));
      window.addEventListener("popstate", (e) => {
        if (e.state && e.state.article && state.stories.length) openArticle(e.state.article, false);
        else if (state.articleId) closeArticle(true);
      });
      document.addEventListener("keydown", (e) => {
        if (!state.articleId) return;
        if (e.key === "Escape") closeArticle();
        if (e.key === "ArrowDown" || e.key === "j") stepArticle(1);
        if (e.key === "ArrowUp" || e.key === "k") stepArticle(-1);
      });

      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      if (isIos && !standalone && !safeStorage.get("ios_prompt_dismissed")) $("ios-prompt").hidden = false;
      $("ios-close").addEventListener("click", () => { $("ios-prompt").hidden = true; safeStorage.set("ios_prompt_dismissed", "true"); });

      if (validArchiveDate(initialArchiveDate)) {
        state.archiveDate = initialArchiveDate;
        setPage("archive");
        loadBriefing();
      } else loadBriefing();
    });
  </script>
</body>
</html>
