name: Probe sources (temporary branch run)

# TEMPORARY: runs the probe once from a fix branch (main's source-probe.yml runs main's code). Deleted right after the run.
# Same guarantees: read-only token, no secrets, no briefing data, no pushes.
on:
  push:
    branches: [fix/probe-window]
    paths: [".github/workflows/source-probe-branch-run.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe every source
        run: python scripts/probe_sources.py --out probe-output/source_probe.json
      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: source-probe
          path: probe-output/source_probe.json
          retention-days: 30
