name: Publish aviation briefings

# A run collects, scores and archives the day's stories and commits the result to the "briefing-data"
# branch in a single commit (none when nothing changed). Runs every 3 hours aligned with 08:00
# Europe/Istanbul (05:00 UTC) for the morning full refresh, followed by 3-hour incremental updates;
# the concurrency group below keeps runs from overlapping.
# Nothing is ever committed to main, and pushes to briefing-data do not deploy (see vercel.json).
on:
  schedule:
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even in off-hours'
        required: false
        type: boolean
        default: true

# The narrowest permission that lets the job push the data branch with GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: aerobrief-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish briefings to the briefing-data branch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALERT_FEEDS: ${{ secrets.ALERT_FEEDS }}
          BRIEFING_STORE: github
          MARKET_DB_PATH: ${{ runner.temp }}/aerobrief-market.sqlite3
        run: |
          FORCE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            FORCE_ARG="--force"
          fi
          python scripts/run_pipeline.py $FORCE_ARG
