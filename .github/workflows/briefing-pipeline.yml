name: Publish aviation briefings

# One hourly run produces both the daily and the hourly briefing and commits them to the
# "briefing-data" branch in a single commit (at most 24 commits a day). Nothing is ever
# committed to main, and pushes to briefing-data do not deploy (see vercel.json).
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Briefing mode to publish"
        required: true
        default: "all"
        type: choice
        options: [all, daily, hourly]

# The narrowest permission that lets the job push the data branch with GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: aerobrief-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish briefings to the briefing-data branch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BRIEFING_STORE: github
          MARKET_DB_PATH: ${{ runner.temp }}/aerobrief-market.sqlite3
          MODE: ${{ inputs.mode || 'all' }}
        run: python scripts/run_pipeline.py --mode "$MODE"
