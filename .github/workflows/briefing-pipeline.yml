name: Publish aviation briefings

# A run collects, scores and archives the day's stories and commits the result to the "briefing-data"
# branch in a single commit (none when nothing changed). GitHub delays and drops scheduled runs under
# load (observed: gaps of 3-5 hours for an hourly cron), so the schedule asks four times an hour at odd
# minutes; the concurrency group below keeps runs from overlapping.
# Nothing is ever committed to main, and pushes to briefing-data do not deploy (see vercel.json).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# The narrowest permission that lets the job push the data branch with GITHUB_TOKEN.
permissions:
  contents: write

concurrency:
  group: aerobrief-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish briefings to the briefing-data branch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRIEFING_STORE: github
          MARKET_DB_PATH: ${{ runner.temp }}/aerobrief-market.sqlite3
        run: python scripts/run_pipeline.py
